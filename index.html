<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>솥탐 레시피</title></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 검색 + 분류별 메뉴 버튼 목록 → 누르면 슬라이드 이미지 전체 화면(확대 가능). 주방 휴대폰용 */
:root{--bg:#f4f3ee;--card:#fffefa;--fg:#282925;--mut:#6b695f;--line:#dcd8cb;--g:#284738;--w:#684E3A;--a:#B58A52;--in:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c19;--card:#262822;--fg:#ecebe4;--mut:#a3a196;--line:#3a3c34;--g:#83b598;--w:#c9a58a;--a:#d3a967;--in:#1f211c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1c19;--card:#262822;--fg:#ecebe4;--mut:#a3a196;--line:#3a3c34;--g:#83b598;--w:#c9a58a;--a:#d3a967;--in:#1f211c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;margin:0;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:20px;margin:0;color:var(--g)}.sub{font-size:12px;color:var(--mut);margin:2px 0 12px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--in);color:var(--fg)}
h2{font-size:13px;color:var(--w);letter-spacing:.04em;margin:18px 0 6px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.list button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;min-height:52px}
.list button:hover{border-color:var(--g)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.view{position:fixed;inset:0;background:var(--bg);z-index:5;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) 20px max(10px,env(safe-area-inset-left,0px))}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;position:sticky;top:0;background:var(--bg);padding:4px 0}
.bar b{font-size:16px;min-width:0}
.bar button{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;white-space:nowrap}
.view img{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
</style>
<div class="wrap">
<h1>솥탐 레시피</h1>
<p class="sub">메뉴를 누르면 레시피 카드가 열립니다 · 두 손가락으로 확대</p>
<input id="q" type="search" placeholder="메뉴 검색 (예: 부대, 막국수)" aria-label="메뉴 검색">
<div id="groups"></div>
</div>
<div class="view" id="view" hidden><div class="bar"><button id="prev" aria-label="이전">‹ 이전</button><b id="vt"></b><button id="next" aria-label="다음">다음 ›</button><button id="close">닫기</button></div><img id="vimg" alt=""><p class="hint">가로로 돌리면 더 크게 보입니다.</p></div>

<script>
(function(){
var S=JSON.parse(document.getElementById('data').textContent),cur=-1;
function el(t,a,txt){var e=document.createElement(t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e}
function draw(q){var g=document.getElementById('groups');g.textContent='';var last='',box=null;
 S.forEach(function(s,i){if(q&&s.t.indexOf(q)<0)return;if(s.g!==last){g.appendChild(el('h2',{},s.g));box=el('div',{class:'list'});g.appendChild(box);last=s.g}
  var b=el('button',{},s.t);b.addEventListener('click',function(){open(i)});box.appendChild(b)});
 if(!g.children.length)g.appendChild(el('p',{class:'sub'},'찾는 메뉴가 없습니다.'))}
function open(i){if(i<0||i>=S.length)return;cur=i;var v=document.getElementById('view');document.getElementById('vt').textContent=S[i].t;var im=document.getElementById('vimg');im.src='slides/'+S[i].f;im.alt=S[i].t+' 간이레시피';v.hidden=false;v.scrollTop=0;try{location.hash='s'+S[i].i}catch(e){}}
function close(){document.getElementById('view').hidden=true;cur=-1;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
document.getElementById('close').onclick=close;document.getElementById('prev').onclick=function(){open(cur-1)};document.getElementById('next').onclick=function(){open(cur+1)};
document.addEventListener('keydown',function(e){if(cur<0)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')open(cur-1);if(e.key==='ArrowRight')open(cur+1)});
document.getElementById('q').addEventListener('input',function(e){draw(e.target.value.trim())});
draw('');
function fromHash(){var m=/^#s(\d+)$/.exec(location.hash);if(m){var n=+m[1];S.forEach(function(s,i){if(s.i===n)open(i)})}else if(cur>=0)close()}
window.addEventListener('hashchange',fromHash);fromHash();
})();
</script></body></html>
